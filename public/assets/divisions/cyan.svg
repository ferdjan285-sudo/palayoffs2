<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="cyanGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E0F7FA" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#006064" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80DEEA" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>
    <filter id="cyanShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#00B0FF" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Outer Cyber Hex Shield -->
  <polygon points="100,12 168,48 168,128 100,188 32,128 32,48" fill="url(#cyanGlow)" stroke="#E0F7FA" stroke-width="4" filter="url(#cyanShadow)" />
  <!-- Inner Dark Core -->
  <polygon points="100,26 154,56 154,120 100,172 46,120 46,56" fill="#031A24" stroke="#00E5FF" stroke-width="2" />
  <!-- Cyber Wolf / Apex Geometric Crest -->
  <path d="M100 48 L125 72 L142 62 L132 95 L118 100 L100 138 L82 100 L68 95 L58 62 L75 72 Z" fill="url(#neonCyan)" stroke="#FFF" stroke-width="2" />
  <!-- Central Crystal -->
  <polygon points="100,68 114,92 100,118 86,92" fill="#E0F7FA" stroke="#00B0FF" stroke-width="1.5" />
  <!-- Letter C -->
  <text x="100" y="100" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#004D40" text-anchor="middle" dominant-baseline="middle">C</text>
  <!-- Circuit Nodes -->
  <circle cx="100" cy="38" r="4" fill="#00E5FF" stroke="#FFF" stroke-width="1.5" />
  <circle cx="58" cy="80" r="3" fill="#80DEEA" />
  <circle cx="142" cy="80" r="3" fill="#80DEEA" />
</svg>
