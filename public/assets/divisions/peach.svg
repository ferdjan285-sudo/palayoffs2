<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="peachGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF3E0" />
      <stop offset="50%" stop-color="#FFCBA4" />
      <stop offset="100%" stop-color="#C2410C" />
    </radialGradient>
    <linearGradient id="warmPeach" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <filter id="peachShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#EA580C" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Outer Solar Shield -->
  <path d="M100 15 L166 45 L156 125 L100 186 L44 125 L34 45 Z" fill="url(#peachGlow)" stroke="#FFF7ED" stroke-width="4" filter="url(#peachShadow)" />
  <!-- Inner Shield Core -->
  <path d="M100 28 L152 54 L144 118 L100 170 L56 118 L48 54 Z" fill="#381005" stroke="#FB923C" stroke-width="2" />
  <!-- Solar Phoenix Crest -->
  <path d="M100 48 L124 74 L142 66 L130 96 L118 102 L100 142 L82 102 L70 96 L58 66 L76 74 Z" fill="url(#warmPeach)" stroke="#FFF" stroke-width="2" />
  <!-- Central Solar Core -->
  <circle cx="100" cy="98" r="16" fill="#FFF7ED" stroke="#EA580C" stroke-width="2" />
  <!-- Letter P -->
  <text x="100" y="104" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#9A3412" text-anchor="middle" dominant-baseline="middle">P</text>
  <!-- Sun Rays on Top -->
  <polygon points="100,34 104,42 112,42 106,47 108,55 100,50 92,55 94,47 88,42 96,42" fill="#FDE047" />
</svg>
