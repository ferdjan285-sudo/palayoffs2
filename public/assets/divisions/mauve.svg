<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="mauveGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E8B4D9" />
      <stop offset="50%" stop-color="#B784A7" />
      <stop offset="100%" stop-color="#5B2950" />
    </radialGradient>
    <linearGradient id="mauveGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#5B2950" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Outer Crest -->
  <path d="M100 15 L165 45 L155 125 L100 185 L45 125 L35 45 Z" fill="url(#mauveGlow)" stroke="#F3E8FF" stroke-width="4" filter="url(#shadow)" />
  <!-- Inner Shield Line -->
  <path d="M100 30 L150 55 L142 118 L100 168 L58 118 L50 55 Z" fill="#2E1128" stroke="#D8B4E2" stroke-width="2" />
  <!-- Winged Valkyrie Crest / Crown -->
  <path d="M100 50 L115 80 L140 75 L125 100 L100 145 L75 100 L60 75 L85 80 Z" fill="url(#mauveGlow)" stroke="#FFF" stroke-width="2" />
  <!-- Central Diamond Core -->
  <polygon points="100,70 115,95 100,120 85,95" fill="url(#mauveGold)" stroke="#FFF" stroke-width="1.5" />
  <!-- Text Letter M -->
  <text x="100" y="102" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#1C0617" text-anchor="middle" dominant-baseline="middle">M</text>
  <!-- Stars -->
  <polygon points="100,38 103,44 110,44 105,48 107,54 100,50 93,54 95,48 90,44 97,44" fill="#FCD34D" />
</svg>
